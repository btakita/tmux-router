name: Release
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        shell: bash
        run: |
          set -euo pipefail
          crate_metadata="$(cargo metadata --no-deps --format-version 1)"
          crate_name="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["name"])' <<<"$crate_metadata")"
          crate_version="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])' <<<"$crate_metadata")"
          if curl -fsS -H "User-Agent: tmux-router-release-check" "https://crates.io/api/v1/crates/${crate_name}/${crate_version}" >/dev/null; then
            echo "${crate_name} ${crate_version} is already published"
            exit 0
          fi
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not configured"
            exit 1
          fi
          cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
